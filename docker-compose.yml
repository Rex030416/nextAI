services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nextai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextai}
      POSTGRES_USER: ${POSTGRES_USER:-nextai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
